name: Deploy LOA Backend Production

# Ownership moved: livestock-backend-prod is now deployed from
# Oatmeal-Farm-Network/oatmealfarmnetworkbackend (livestock/ + deploy-livestock-prod.yml).
# This workflow is retained only as a manual emergency escape hatch; it does not
# run on push so the two repos cannot overwrite each other.

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.PROD_GCP_PROJECT_ID || 'animated-flare-421518' }}
  REGION: ${{ vars.PROD_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.PROD_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: livestock-backend-prod
  IMAGE_NAME: livestock-backend
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.PROD_RUNTIME_SA || '802455386518-compute@developer.gserviceaccount.com' }}
  CLOUDSQL_INSTANCE: ${{ vars.PROD_CLOUDSQL_INSTANCE || 'animated-flare-421518:us-central1:oatmealailive' }}
  WIF_PROVIDER: ${{ vars.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/802455386518/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
  DEPLOYER_SA: ${{ vars.PROD_GCP_SERVICE_ACCOUNT || 'github-deployer@animated-flare-421518.iam.gserviceaccount.com' }}

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Ownership moved
        run: |
          echo "::notice::livestock-backend-prod is owned by oatmealfarmnetworkbackend/livestock."
          echo "Do not use this workflow unless that path is broken and you are intentionally rolling back."

  deploy:
    needs: notice
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          docker build \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA::12}" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 20 \
            --timeout 300 \
            --add-cloudsql-instances "${CLOUDSQL_INSTANCE}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
